[supervisord]
nodaemon=true
logfile=/tmp/sti/supervisor.log
pidfile=/tmp/sti/supervisor.pid
childlogdir=/tmp/sti

[unix_http_server]
file=/tmp/sti/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/sti/supervisor.sock

[program:desktop]
command=openbox
autorestart=unexpected
stdout_logfile=/tmp/sti/desktop.log
stderr_logfile=/tmp/sti/desktop.err

[program:vnc]
command=x11vnc -display :1 -forever -shared -localhost -rfbport 5900 -nopw -noxdamage
autorestart=unexpected
stdout_logfile=/tmp/sti/vnc.log
stderr_logfile=/tmp/sti/vnc.err

[program:web]
command=websockify --web=/usr/share/novnc/ 6080 localhost:5900
autorestart=unexpected
stdout_logfile=/tmp/sti/web.log
stderr_logfile=/tmp/sti/web.err

[program:demo]
command=/opt/sti/scripts/demo.sh
autorestart=false
stopasgroup=true
killasgroup=true
stdout_logfile=/tmp/sti/demo.log
stderr_logfile=/tmp/sti/demo.err

[program:terminal]
command=xterm -geometry 85x12+0+560 -title "STI terminal: python3 /opt/sti/scripts/check.py"
autorestart=false
stdout_logfile=/tmp/sti/terminal.log
stderr_logfile=/tmp/sti/terminal.err
