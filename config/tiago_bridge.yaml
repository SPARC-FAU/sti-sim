# Sensor transport names verified against PAL's humble-devel bridge configuration.
# ros2_control provides joint states. The base is driven by Gazebo itself
# (see add_base_drive in scripts/initial_pose.py), on PAL's topic names.
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: ignition.msgs.Clock
  direction: GZ_TO_ROS
- ros_topic_name: /scan_front_raw
  gz_topic_name: /scan_front_raw
  ros_type_name: sensor_msgs/msg/LaserScan
  gz_type_name: ignition.msgs.LaserScan
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
- ros_topic_name: /scan_rear_raw
  gz_topic_name: /scan_rear_raw
  ros_type_name: sensor_msgs/msg/LaserScan
  gz_type_name: ignition.msgs.LaserScan
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
- ros_topic_name: /head_front_camera/color/image_raw
  gz_topic_name: /head_front_camera/color
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: ignition.msgs.Image
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
- ros_topic_name: /head_front_camera/color/camera_info
  gz_topic_name: /head_front_camera/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: ignition.msgs.CameraInfo
  direction: GZ_TO_ROS
- ros_topic_name: /head_front_camera/depth/image_rect_raw
  gz_topic_name: /head_front_camera/depth/depth_image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: ignition.msgs.Image
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
- ros_topic_name: /head_front_camera/depth/color/points
  gz_topic_name: /head_front_camera/depth/points
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: ignition.msgs.PointCloudPacked
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
- ros_topic_name: /mobile_base_controller/cmd_vel_unstamped
  gz_topic_name: /mobile_base_controller/cmd_vel_unstamped
  ros_type_name: geometry_msgs/msg/Twist
  gz_type_name: ignition.msgs.Twist
  direction: ROS_TO_GZ
- ros_topic_name: /mobile_base_controller/odom
  gz_topic_name: /mobile_base_controller/odom
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: ignition.msgs.Odometry
  direction: GZ_TO_ROS
- ros_topic_name: /tf
  gz_topic_name: /mobile_base_controller/odom_tf
  ros_type_name: tf2_msgs/msg/TFMessage
  gz_type_name: ignition.msgs.Pose_V
  direction: GZ_TO_ROS
